  description: >
    Andrew Case grew up on the mission field in Oaxaca, Mexico, and is a graduate of The Southern
    Baptist Theological Seminary. He also studied Bible Translation at the Canada Institute of
    Linguistics. His joys include teaching, preaching, leading worship, dinosaurs, Hebrew, L.M.
    Montgomery, and song-writing.

    Andrew served with Wycliffe Bible Translators in Equatorial
    Guinea for seven years, and now he and his wife work in Mexico. Andrew is a Bible translation
    consultant, and is passionate about abolishing the Jesus trade — find out more at https://sellingjesus.org.

    He and his wife also teach biblical Hebrew to thousands all over the world through https://freehebrew.online.
    You can find his academic articles at https://sbts.academia.edu/AndrewCase
