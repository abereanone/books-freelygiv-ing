  slug: brett-maragni
  description: >
    Brett Maragni is the founder and pastor of Harvest Jacksonville, a Bible church in
    Jacksonville, Florida, and the host of the podcast "Sound of Truth with Brett Maragni."
    A native of Benton, Illinois, he has served in vocational ministry for nearly four
    decades, in churches in Illinois, Texas, Kentucky, Tennessee, and Florida. He is a
    graduate of Union University (B.A.), Southwestern Baptist Theological Seminary (M.Div.),
    and Luther Rice Seminary (D.Min.). He and his wife, Lacey, have been married for over
    thirty years and have four adult children.


    The first edition of These Five Anchors was sold on Kindle at a low price. He no longer
    takes royalties on it: "I have freely received, so I freely give (Matthew 10.8)... I am
    not selling the content of this book. For those of you who aim to write material for the
    edification of God's people or the evangelization of those not yet in God's fold, I hope
    this motivates you to consider doing the same."
  donateUrl: ""
