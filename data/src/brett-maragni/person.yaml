  description: >
    Brett Maragni is the founder of Harvest Jacksonville, where he serves as lead teacher and
    an elder, and the founder of Sound of Truth Ministries — the home of his video teachings,
    audio podcast, books and blog. Teaching publicly since his late teens, he has been a guest
    speaker at churches, camps, retreats, college chapels, and various other venues.


    A native of southern Illinois, he is a graduate of Union University (B.A.), Southwestern
    Seminary (M.Div.), and Luther Rice (D.Min.). He and his wife, Lacey, are the blessed
    parents of four grown children. He is also a member of the ownership group of the NFL's
    Green Bay Packers.


    The first edition of These Five Anchors was sold on Kindle. He no longer takes royalties
    on it: "I have freely received, so I freely give (Matthew 10.8)... I am not selling the
    content of this book. For those of you who aim to write material for the edification of
    God's people or the evangelization of those not yet in God's fold, I hope this motivates
    you to consider doing the same."
