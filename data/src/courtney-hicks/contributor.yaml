  description: >
    Courtney has a background in systems administration and IT and, over time, has developed a desire to make classic Christian literature more widely available and free from the copyrights and DRM imposed by modern Christian publishers.

    “I first became interested in making Christian works readily available when I discovered that publishers require permission to use the Bible in ministry and impose DRM restrictions on Christian books. My desire is to keep edifying books free and available so that Christ may build up the church through them.”
