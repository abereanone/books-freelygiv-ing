  description: >
    Martin Luther (1483–1546) was a German theologian and the central figure of the Protestant
    Reformation. Born in Eisleben, he studied at the University of Erfurt before entering an
    Augustinian monastery, driven by spiritual anxiety about salvation. He earned his doctorate
    at Wittenberg and became a professor of theology. On November 1, 1517, he posted his famous
    ninety-five theses challenging indulgence practices, sparking widespread controversy across
    Europe. At the Diet of Worms in 1521, he declared his conscience bound only by Scripture
    and was subsequently sheltered at Wartburg Castle, where he translated the New Testament
    into German. He married Katharina von Bora in 1525 and continued leading the Reformation,
    organizing churches and shaping Protestant theology until his death.
