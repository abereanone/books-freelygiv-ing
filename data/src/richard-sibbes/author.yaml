  description: >
    Richard Sibbes (1577–1635) was an English Puritan theologian, born in Tostock, Suffolk,
    the son of a wheelwright. He studied at St John's College, Cambridge and served as lecturer
    at Holy Trinity Church, Cambridge from around 1610 to 1616. In 1617 he became preacher at
    Gray's Inn, London, and in 1626 returned to Cambridge as Master of St Catharine's Hall while
    maintaining his London position.

    Known for his warm and comforting preaching style, his
    works — most published posthumously — emphasized the tender mercies of Christ and the
    consolations of the gospel. He was a founding member of the Feoffees for Impropriations,
    which funded and supported Puritan preachers. He died unmarried at Gray's Inn in 1635.
