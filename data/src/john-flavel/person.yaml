  description: >
    John Flavel (about 1627–1691) was an English Puritan minister, the eldest son of the Rev.
    Richard Flavel, born at Bromsgrove in Worcestershire. He studied at University College,
    Oxford, and in 1650 was sent to Diptford in Devon, where he was ordained and served about
    six years. In 1656 he moved to Dartmouth, though the Diptford living paid far more.

    Ejected by the Act of Uniformity in 1662, he went on preaching in private until the Five
    Mile Act drove him from the town. He settled at Slapton, five miles off, and preached there
    twice each Sunday to all who came, many of them his old parishioners; it was there, in 1667,
    that he dated Keeping the Heart. He came back to Dartmouth under the indulgence of 1671, met
    his people nightly in his own house through the hard years that followed, and saw them build
    him a meeting-house in 1687. He died suddenly at Exeter on 26 June 1691 and was buried at
    Dartmouth.

    He was a popular and prolific author. Among his best-known works are Husbandry Spiritualized,
    Navigation Spiritualized, The Fountain of Life Opened, A Token for Mourners, The Mystery of
    Providence and The Method of Grace.

    Adapted from the Dictionary of National Biography (1889), which is in the public domain.
