  description: >
    Michael is the proprietor of Freely Given Books. He is passionate about spreading God's Word freely through this website, and is also the owner of several other websites where you might find edification and high-quality, free-to-you resources. Here is a list of those sites you may enjoy: https://michaelcoughlin.net/links

    Michael is a particular Baptist preacher who has served Christ's Church as pastor, evangelist, teacher, writer, and application developer. He lives in Ohio with his wife, Erin, and their two youngest boys, and is active in abortion abolition work and the local church. You can read his writing at michaelcoughlin.net and thingsabove.us, and hear his sermons and teaching at teaching.michaelcoughlin.net.

    Michael has worked in IT since 1998. His love for development and for Christianity converge nicely in the creation of apps for the Church to use.

    “I want to make things that the church can use to edify saints, help them in their walk with God, and serve one another.”

    One of his favorite verses is Galatians 2:20: “I have been crucified with Christ, and I no longer live, but Christ lives in me. The life I live in the body, I live by faith in the Son of God, who loved me and gave Himself up for me.”
