  description: |
    The whole Bible, Genesis to Revelation, in the Berean Standard Bible (BSB): a modern English translation from the Hebrew and Greek, which its translators dedicated to the public domain.

    This edition sets the text in two columns, with the BSB's paragraphs and poetry lines, the psalm titles set apart, and the first and last verse of each page at its head. The divine name is printed Yahweh, and where "you" or "your" is plural it is marked "you+" or "your+." The few verses that differ from the BSB in any other way are marked in the text and listed at the back; What's New? shows each one beside the BSB.
