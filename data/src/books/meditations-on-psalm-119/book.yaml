  description: |
    Psalm 119 is 176 verses in 22 sections of eight, and it is the longest chapter in the Bible. Memorize it four verses a week and you will have the whole psalm in a year.

    Meditations on Psalm 119 is a companion for that journey: 44 weekly meditations, one for each set of four verses. Every chapter opens with the verses printed in full (Berean Standard Bible), so you can read, memorize, and meditate with the text in front of you. Scripture that is cited but not quoted is printed in the footnotes, and a Scripture index at the back helps you find any reference.

    Read it, memorize it, and let it work on your heart.
