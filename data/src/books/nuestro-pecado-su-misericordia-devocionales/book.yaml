  description: |
    Nuestro pecado, su misericordia se escribió para ayudar a los niños a confesar su pecado con sinceridad, a confiar en el perdón que hay en Jesucristo y a crecer en obediencia alegre a Dios.

    Dieciséis devocionales cortos, a todo color, para leer y orar juntos, cada uno con una confesión de pecado, la seguridad del perdón, una oración y un versículo para memorizar de la Reina-Valera 1909. Un complemento para niños de Nuestro pecado, su misericordia.
