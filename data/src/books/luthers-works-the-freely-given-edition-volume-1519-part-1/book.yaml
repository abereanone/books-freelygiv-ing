  description: |
    The Freely Given Edition of Luther's Works is a new public domain collection of the Reformer's writings. The inaugural volume is dedicated to a deeper understanding of The Fourteen of Consolation (1519) and answers new questions of influence, timing, and language by its thorough introduction and notes. It is the hope of the editor that this edition's open licensing will allow for the flourishing of both the Christian faith and Lutheran scholarship, and that it may work towards ending the spiritual famine of the global Church caused by the compromise of ministry through reciprocity.
