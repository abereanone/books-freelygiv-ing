  description: |
    The third of four volumes of Gouge's Of Domesticall Duties (1622), on children and parents.

    First the child's part: showing respect to father and mother, asking their leave, obeying their instruction and submitting to their correction, giving back to them when they are old and in need, and doing all of it in the Lord.

    Then the parent's: loving, praying for and providing for children; nurturing, teaching and training them; admonishing and correcting them; directing them into adulthood and a calling; and dealing faithfully with every child under their care, not only the ones easiest to love.

    Set from the 1622 first edition in modern spelling, with Gouge's own wording kept.
