  description: |
    The last of four volumes of Gouge's Of Domesticall Duties (1622), on servants and masters — the part of the household a modern reader meets least expectedly and may find speaks most directly to work.

    The servant's duties: reverence for his master, obedience, faithful and willing service rather than eye-service, and the point past which no master may be obeyed, because both of them answer to God.

    The master's: authority rightly maintained, correction and government of the household, care for his servants' souls as well as their bodies, employing and rewarding them justly, and the remembrance that he has a Master of his own in heaven.

    Set from the 1622 first edition in modern spelling, with Gouge's own wording kept.
