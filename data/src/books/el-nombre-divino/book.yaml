  description: |
    ¿Por qué tantas Biblias ponen SEÑOR donde el hebreo dice יהוה? ¿Cómo se llegó a evitar el nombre personal que Dios mismo se dio, y qué deben hacer hoy los traductores con él?

    Andrew Case recorre la larga historia de cómo se ha evitado ese nombre: el paso de pronunciarlo a suprimirlo, el uso de «Señor» en el Nuevo Testamento, la práctica de la iglesia primitiva y de la Antigüedad tardía, y la manera en que distintas lenguas y versiones han tratado יהוה desde entonces. Junto a la historia aborda las preguntas prácticas: qué se puede saber de su pronunciación, cómo se impuso el tabú y en qué consiste hoy la fidelidad para un traductor.

    A lo largo del libro sostiene que Dios quiere que su nombre se pronuncie y se recuerde. Está escrito para cristianos y traductores de la Biblia que quieren entender las distintas posturas en lugar de heredar una convención sin examinarla.
