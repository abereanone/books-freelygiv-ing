  description: |
    "If I am asked what is my creed, I reply, 'It is Jesus Christ.'" Compiled by his wife and his private secretary from his diary, letters, and records, this third volume covers the years 1856 to 1878: the opening of the Metropolitan Tabernacle and its deacons and elders; notable lectures and memorable services; the Pastors' College, the colporteurs, and the Stockwell Orphanage; the new "Helensburgh House"; his travels on the Continent and his letters home and to his people; his twin sons' memories of their father; his later literary works and the blessing on his printed sermons; and his pure fun and his preaching in the open air.

    This edition follows the London edition of 1899 (C. H. Spurgeon's Autobiography, Vol. III), with its pictures, its London spelling, and footnotes giving the verses cited (Berean Standard Bible).
