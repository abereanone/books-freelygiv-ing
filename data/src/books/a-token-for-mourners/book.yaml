  description: |
    "And when the Lord saw her, he had compassion on her, and said unto her, Weep not" (Luke 7:13). Flavel buried his wife and his only son within one year. Soon after, death took the only child of his brother and sister, and he sent them these pages, "the after-fruits of my own troubles."

    From Christ's words to the widow of Nain he shows how far a Christian may mourn, when sorrow becomes sinful, how to answer the pleas a grieving heart makes for itself, and how to cure and prevent immoderate grief. This edition follows the 1813 Brattleboro text, checked page by page against the printed book, with footnotes giving the verses Flavel cites (Berean Standard Bible) and explaining old words, and a glossary.
