  description: |
    One of the most searching and honest spiritual autobiographies in the English language. John Bunyan recounts with piercing candor the story of his conversion — his years of wild youth, his years of agonizing doubt and temptation, and the slow, painful breaking of his soul by the grace of God. Written in Bedford jail, this book is not a polished memoir but a raw, numbered account of God's pursuit of a sinner. Bunyan's struggle with assurance, his terrors of conscience, his flashes of gospel comfort, and his final rest in Christ have brought strength to countless readers who have walked the same dark road.
