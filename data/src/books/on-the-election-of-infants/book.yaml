  description: |
    What happens when a baby dies? Christians who lose a child, through miscarriage, illness, or abortion, want to know what the Bible gives them to hope for.

    In this short booklet, Michael Coughlin walks through the six positions believers take on the election of infants, sets aside the ones that cannot stand, and calls for charity on every side, because real love offers hurting people rational hope. Scripture that is cited but not quoted is printed in the footnotes (Berean Standard Bible).
