  description: |
    For centuries, both Christian and non-Christian philosophers have argued whether babies that die in infancy go to Heaven. Avoiding the topic entirely isn’t an option in a cursed world where grieving parents are looking for hope after losing their child.

    This booklet summarizes the rational positions one can take on the election of infants, eliminates the absurd ones, and explains the implications of the views that are “in play.” Scripture that is cited but not quoted is printed in the footnotes (Berean Standard Bible).

    Real love offers hurting people rational hope.
