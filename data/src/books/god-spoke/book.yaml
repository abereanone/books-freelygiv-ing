  description: |
    How did we come to have the Bible as we know it today? How can it be called the Word of God when men wrote it? Are there lost books of the Bible? Why are there verses missing in my Bible? Why do Bible translations differ from one another?

    Many questions could be asked about the history of the Bible. The story of how we came to have the Bible is a fascinating story, yet it is also a tale often mired in misinformation, sensationalism, and confusion—especially on the internet and in popular media sources. This book aims to clear away some of the confusion and to equip believers to better understand how it is that they have come to have the Bible. Within these pages, you will learn what we can know about the authors of Scripture; how the canon was formed and why we have the books that we have in our Bible; how the Bible was copied down through the centuries; and ultimately how it was translated into English so that we can read it in our own language. Written to function as both an introduction to the subject and as a reference resource, come embark on the marvelous journey that is the story of how we came to have the Bible as we know it today.
