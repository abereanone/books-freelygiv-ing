  description: |
    "I have had to lean on the bare arm of God. It is a grand sensation." Compiled by his wife and his private secretary from his diary, letters, and records, this fourth and last volume follows Spurgeon through his last fourteen years, from 1878 to 1892: a winter at Mentone, told by his son Thomas; the "double silver wedding" of his pastorate and his marriage; enquirers and converts; his home at "Westwood" and a typical week's work; his letters, and his opinions on the questions of the day; his jubilee; the "Down-Grade" Controversy, from his own standpoint; his books and reading; the growth of the Institutions; and his last letters from Mentone, his long illness, and his death.

    This edition follows the London edition of 1900 (C. H. Spurgeon's Autobiography, Vol. IV), with its pictures, its London spelling, and footnotes giving the verses cited (Berean Standard Bible).
