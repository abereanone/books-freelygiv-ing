  description: |
    Durante siglos, filósofos cristianos y no cristianos han debatido si los bebés que mueren en la infancia van al cielo. Esquivar del todo el tema no es posible en un mundo maldito, donde hay padres en duelo que buscan esperanza después de perder a su hijo.

    Este folleto resume las posturas racionales que se pueden adoptar sobre la elección de los infantes, descarta las absurdas y explica qué implican las posturas que están “en juego”. Los pasajes de las Escrituras a los que se hace referencia sin citarlos aparecen en las notas al pie (Reina-Valera 1909).

    El amor verdadero ofrece a los que sufren una esperanza racional.
