  description: |
    El Salmo 119 tiene 176 versículos en 22 secciones de ocho, y es el capítulo más largo de la Biblia. Si memorizas cuatro versículos por semana, en un año tendrás el salmo completo.

    Meditaciones sobre el Salmo 119 te acompaña en ese camino: 44 meditaciones semanales, una por cada grupo de cuatro versículos. Cada capítulo comienza con sus versículos impresos completos (Reina-Valera 1909), para que puedas leer, memorizar y meditar con el texto delante. Los pasajes que se citan sin transcribirse aparecen en las notas al pie, y un índice bíblico al final te ayuda a encontrar cualquier referencia.

    Léelo, memorízalo y deja que obre en tu corazón.
