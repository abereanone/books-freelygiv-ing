  description: |
    "You may write my life across the sky, I have nothing to conceal." Compiled by his wife and his private secretary from his diary, letters, and records, this second volume follows Spurgeon through his first years in London, from 1854 to 1860: his courtship of Susannah Thompson and their marriage, told in her own words; the criticisms and slanders of the early years; his first visit to Scotland; the beginning of the Pastors' College; his first printed works; the catastrophe at the Surrey Gardens Music Hall and the services held there afterwards; the home at Nightingale Lane; and the building of the Metropolitan Tabernacle.

    This edition follows the London edition of 1898 (C. H. Spurgeon's Autobiography, Vol. II), with its pictures, its London spelling, and footnotes giving the verses cited (Berean Standard Bible).
