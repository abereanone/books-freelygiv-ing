  description: |
    "Preaching is characteristic of Christianity." Broadus wrote this book in 1870, after ten years of teaching preachers at the Southern Baptist Theological Seminary, to join sound principles with plain practical rules. It takes the preacher through the whole work: choosing and interpreting a text, the materials of a sermon (explanation, argument, illustration and application), arrangement and the kinds of sermons, a clear, forceful and fitting style, the methods of delivery, voice and gesture, and the conduct of public worship.

    This edition follows the original of 1870, not the revision of 1898, checked page by page against the printed book. It keeps Broadus's own footnotes and the Index, with its page numbers set to this edition.
