  description: |
    A large-print songbook of well-loved hymns for the church, from "A Mighty Fortress Is Our God" to "It Is Well with My Soul," with Christmas carols, a few songs from Psalm 119, and Bible verses after many of the hymns to reinforce the truths they sing.

