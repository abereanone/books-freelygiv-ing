  description: |
    Written just before Bunyan's twelve-year imprisonment in Bedford jail, this is his most extended theological work — a careful, searching exposition of the two covenants: the Covenant of Works and the Covenant of Grace. Bunyan opens Romans 6:14 ("For ye are not under the law, but under grace") and works through the nature of the law, what it means to be under it, and who the blessed souls are who have been brought into the freedom of grace through Christ. Characteristically plain-spoken and saturated with scripture, this book shows Bunyan not merely as a storyteller but as a serious, capable theologian whose pastoral heart never departs from the practical application of doctrine. The text here follows the public-domain edition prepared by George Offor for The Works of John Bunyan (1855), and includes Offor's editorial advertisement and notes.
