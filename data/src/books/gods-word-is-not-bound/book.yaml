  description: |
    "In the modern world, Scripture is often controlled by copyright. Bible translations, manuscript images, and critical texts are legally protected and treated as proprietary works. But can these systems be reconciled with the Bible's own teaching about the nature of God's Word?"

    A book-length examination of the theology, history, and ethics of Bible distribution. It asks whether contemporary publishing practices reflect faithful stewardship of God's revelation, and takes up the questions that follow: who owns the manuscripts and critical texts, how the Bible societies produced the first copyrighted Bible in America, whether copyright actually protects Scripture from corruption, and what it means that publishers now stand between the church and the text.

    Part One works through the historical and practical case, from the debate over selling licenses to Bible translations, through adaptation and inspiration, the sin of Balaam, and the question of whether Bible publishers are stewards or gatekeepers, closing with the Sunnyvale Statement on the Stewardship of Scripture. Part Two turns to the biblical argument — the Dorean Principle, Jesus' command to freely give, copyright as a perversion of justice, 2 Corinthians 2:17 on commercializing the word of God, the myth of institutional innocence, and why the KJV is not the solution.

    Written by Andrew Case with contributions from Conley Owens, Michael Coughlin, and Jon Here. Published by Selling Jesus and dedicated to the public domain.
