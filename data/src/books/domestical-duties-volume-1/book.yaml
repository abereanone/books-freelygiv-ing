  description: |
    The first of four volumes of Gouge's Of Domesticall Duties (1622), the most used English book on family life for a century after it appeared.

    This volume holds the Epistle Dedicatory and the first treatise: Gouge's exposition of Ephesians 5:21–6:4, the text the whole work is built on. He takes it clause by clause — mutual submission in the fear of God, the wife's place and the husband's, the headship of Christ over the church as the pattern for marriage, the love that purifies, the ancient law of one flesh, and then the duties children owe parents and parents owe children. The seven treatises that follow in Volumes II to IV are the application of this one.

    Set from the 1622 first edition in modern spelling, with Gouge's own wording kept.
