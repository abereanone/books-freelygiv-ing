  description: |
    "I looked to Him; He looked on me; and we were one for ever." Compiled by his wife and his private secretary from his diary, letters, and records, this first volume tells Spurgeon's story largely in his own words, from his birth in 1834 to his first year in London: childhood at his grandfather's manse at Stambourne, school at Colchester and Maidstone, his conversion in a Primitive Methodist chapel on a snowy Sunday in January 1850, his baptism in the river at Isleham, his first sermons in the cottages of the fens, the village pastorate at Waterbeach, and the call to New Park Street Chapel.

    This edition follows the London edition of 1897 (C. H. Spurgeon's Autobiography, Vol. I), with its pictures, its London spelling, and footnotes giving the verses cited (Berean Standard Bible).
