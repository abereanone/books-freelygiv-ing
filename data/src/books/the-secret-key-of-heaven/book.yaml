  description: |
    "But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly." — Matthew 6:6

    Brooks wrote this treatise because he could find no other. He asked old disciples whether they had ever heard one sermon on closet prayer among the thousands they had heard, or read any book on it, and they answered no. So he set himself to the neglected duty, and pressed it home with twenty arguments: that the most eminent saints have been most in secret prayer, that Christ Himself much exercised it, that it distinguishes the Christian from the hypocrite, that in secret we may freely unbosom our souls to God, that secret duties shall have open rewards, and that "every man is that really which he is secretly. There are many that sweat upon the stage that are key-cold in their closets."

    The second half is all application — searching words for those who neglect closet prayer, answers to the six objections men commonly raise against it (we have much business, we are servants with no time of our own, we lack the gifts others have, God already knows our wants, we have no convenient place, our weaknesses shut us up), and eleven particulars of counsel for praying well in secret.

    Set from Thomas Brooks's The Privy Key of Heaven (1665) and lightly modernized.
