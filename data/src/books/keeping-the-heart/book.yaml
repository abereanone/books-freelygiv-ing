  description: |
    "Keep thy heart with all diligence; for out of it are the issues of life" (Proverbs 4:23). Flavel wrote this little book in 1667 for his flock at Dartmouth, when the law had shut him out of their pulpit. It shows what it is to keep the heart, why it is the great business of a Christian's life, and how to keep it in twelve seasons that try every believer: prosperity and adversity, public danger and private want, injuries and provocations, temptation, spiritual darkness, suffering for Christ, and sickness and death.

    This edition follows the American Tract Society text (Keeping the Heart; or, The Saint Indeed), checked page by page against the printed book, with footnotes giving the verses Flavel cites (Berean Standard Bible) and explaining old words, and a glossary.
