  description: |
    Thomas Watson draws the portrait of a true Christian with a scripture-pencil, describing in vivid, memorable strokes the marks of a man who is going to heaven. In twenty-four characteristics — from the man who is deeply humbled for sin to the man who makes God his chief joy — Watson provides both a mirror for self-examination and a map toward genuine godliness. The writing is Puritan at its best: theologically exact, practically urgent, and full of warm illustrations. Whether used for self-examination, devotional reading, or pulpit preparation, this book has shaped the piety of English-speaking Christians for three and a half centuries.
