  description: >
    John Owen (1616–1683) was an English Puritan theologian and pastor, educated at Queen's
    College, Oxford. Under Cromwell he served as dean of Christ Church and as Vice-Chancellor
    of the University of Oxford. After the Restoration he lost his place and spent the rest
    of his life pastoring an Independent congregation in London and writing.

    Owen is remembered for the depth and thoroughness of his theology and for his pastoral
    seriousness about sin and holiness. Among his best-known works are The Death of Death in
    the Death of Christ, Of the Mortification of Sin in Believers, Of Temptation, Communion
    with God, and his seven-volume Exposition of Hebrews.
