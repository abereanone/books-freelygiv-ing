  description: >
    Shelby grew up in a small Oklahoma town, was saved in late 2001, and surrendered his life to the work of the ministry at age 13. He met his wife, Beth, while they were both attending Bible College. After graduation, Shelby has served over the years as a children's pastor, a youth pastor, and a "whatever else is needed around here" man in various Independent Baptist and Southern Baptist churches. He has a passion for instructing others in the work of the ministry and leading them to a fuller knowledge of the Scriptures and even more, the great God who breathed out those Scriptures.
